<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cat Animation Overlay</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-screen">
      <header>
        <span class="eyebrow">Демонстрационный экран</span>
        <h1>Главная</h1>
      </header>
      <section class="balance-card">
        <span>Карманные деньги</span>
        <strong>1 240 ₽</strong>
      </section>
      <section class="action-grid" aria-label="Действия">
        <button type="button">История</button>
        <button type="button">Копилка</button>
        <button type="button" id="replay-demo">Повторить анимацию</button>
      </section>
      <section class="feed" aria-label="Лента">
        <article>Новое достижение</article>
        <article>Совет дня</article>
        <article>Задания</article>
      </section>
    </main>

    <canvas id="cat-animation-overlay" aria-hidden="true"></canvas>
    <script type="module" src="./prank.js"></script>
  </body>
</html>
