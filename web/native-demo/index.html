<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Котики и клубки</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      #cat-animation-overlay {
        position: fixed; inset: 0; width: 100%; height: 100%;
        pointer-events: none; touch-action: none;
      }
    </style>
  </head>
  <body>
    <!--
      Игра для нативного линкера (iOS/Android): физика клубков + общий рендер ../src (CatAnimation).
      Линкер вызывает window.PrankBridge.init/show/hide и шлёт наклон событием `prank:tilt`.
    -->
    <canvas id="cat-animation-overlay" aria-hidden="true"></canvas>
    <script type="module" src="./game.js"></script>
  </body>
</html>
